# 极简 Jekyll 配置
title: Jingming Hu
description: Personal academic homepage
url: https://hjm-jim.github.io
baseurl: ""
repository: hjm-jim/hjm-jim.github.io

# 作者信息（显示在侧栏）
author:
  name: Jingming Hu
  avatar: profile.png
  bio: 硕士生 @ 武汉大学
  location: 武汉, 中国
  email: jimmyh2020@163.com
  github: hjm-jim

# Markdown 设置
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  toc_levels: 1..3

# 排除不需要编译的文件
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CLAUDE.md
  - vendor

# 默认布局
defaults:
  - scope:
      path: ""
    values:
      layout: default

plugins:
  - jekyll-sitemap
  - jekyll-feed
